name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes any in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm build` runs `tsc --noEmit` before `vite build`.
      - name: Type-check and build
        run: pnpm build

      # `tauri::generate_context!` embeds `frontendDist`, so the backend job
      # cannot compile the lib without these assets.
      - name: Upload dist for the backend job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  backend:
    name: Backend (cargo test --lib)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The library links against Tauri, so the WebKitGTK 4.1 stack is required
      # even though CI never bundles an installer.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings

      - name: Check generated TypeScript bindings
        working-directory: src-tauri
        run: |
          cargo test --lib ts_bindings::tests::export_bindings -- --exact --nocapture
          git -C .. diff --exit-code src/types/generated

      - name: Run library tests
        working-directory: src-tauri
        run: cargo test --lib
