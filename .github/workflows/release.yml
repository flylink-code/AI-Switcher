name: Release application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis,msi
          # Ubuntu 22.04 matches WebKitGTK 4.1 + broader glibc compatibility for AppImage.
          - platform: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    env:
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libgtk-3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: v__VERSION__
          releaseName: AI-Switcher v__VERSION__
          releaseBody: |-
            ## AI-Switcher v__VERSION__

            ## What's new

            - Safe library import: close SQLite before replacing `app.db` (fixes Linux `database disk image is malformed`)
            - Import rematerializes API keys from credential-inclusive archives into the OS keyring
            - Folder pickers default into app/sync directories so Linux can open hidden `.ai-switcher` / `.claude-switcher` paths
            - Quick buttons for backups and sync `incoming` directories

            ## 更新内容

            - 安全导入资料库：替换 `app.db` 前关闭 SQLite 连接（修复 Linux 上 `database disk image is malformed`）
            - 含 API Key 的归档导入后会写入系统凭据库并生效
            - 目录选择默认进入应用/同步目录，便于 Linux 打开隐藏的 `.ai-switcher` / `.claude-switcher`
            - 增加 backups / 同步 incoming 快捷入口

            ### Windows
            Prefer the NSIS `.exe` for per-user installs without admin. MSI still requires elevation.
            In-app updates are signed and delivered from this release.
            建议使用 NSIS `.exe`（当前用户安装，通常无需管理员）；MSI 仍会请求提升权限。
            应用内更新会从本 Release 获取已签名更新。

            ### Linux (preview)
            Prefer the `.AppImage` (`chmod +x`, no sudo). `.deb` installs/updates need administrator privileges.
            Linux builds are best-effort: Claude Desktop localization / some Windows-only tools are unavailable.
            建议优先使用 `.AppImage`（先 `chmod +x`，无需 sudo）；`.deb` 需要管理员权限。
            Linux 为尽力支持：Claude Desktop 中文化等 Windows 专用能力不可用。
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
          updaterJsonKeepUniversal: true

  # Run after both platform builds so latest.json includes every uploaded platform.
  mirror-updater:
    name: Publish mirrored updater manifest
    needs: release
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mirror latest.json through gh-proxy
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p /tmp/ai-switcher-release
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir /tmp/ai-switcher-release; then
            echo "latest.json not found on release $tag; skip mirror"
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("/tmp/ai-switcher-release/latest.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          platforms = data.get("platforms") or {}
          for meta in platforms.values():
              url = meta.get("url")
              if isinstance(url, str) and url and not url.startswith("https://gh-proxy.com/"):
                  meta["url"] = f"https://gh-proxy.com/{url}"
          target = Path("/tmp/ai-switcher-release/latest-mirror.json")
          target.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print(f"mirrored platforms: {list(platforms)}")
          PY
          gh release upload "$tag" /tmp/ai-switcher-release/latest-mirror.json --repo "$GITHUB_REPOSITORY" --clobber
