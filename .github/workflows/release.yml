name: Release Windows application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows installers
    runs-on: windows-latest
    env:
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: v__VERSION__
          releaseName: AI-Switcher v__VERSION__
          releaseBody: |-
            ## AI-Switcher v__VERSION__

            ## What's new

            - Fixed dark theme backgrounds, borders, and text across all content cards and controls
            - Redesigned the yearly usage heatmap to fill the available width without tiny circular cells
            - Kept shorter heatmap ranges compact while preserving tooltips and intensity levels

            ## 更新内容

            - 修复全部内容卡片和控件在深色模式下的背景、边框与文字颜色
            - 重构年度用量热力图，自适应铺满可用宽度且不再显示为过小圆点
            - 保持短周期热力图紧凑，并保留提示信息和强度等级

            Download the NSIS installer for new installations. In-app updates are signed and delivered from this release.
            新安装请下载 NSIS 安装包；应用内更新会从本 Release 获取已签名更新。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
          updaterJsonKeepUniversal: true

      - name: Publish mirrored updater manifest
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "ai-switcher-release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          gh release download "${{ github.ref_name }}" --repo "$env:GITHUB_REPOSITORY" --pattern latest.json --dir $releaseDir
          $source = Join-Path $releaseDir "latest.json"
          $mirror = Get-Content -Raw -Path $source | ConvertFrom-Json
          foreach ($platform in $mirror.platforms.PSObject.Properties) {
            $url = $platform.Value.url
            if ($url -and -not $url.StartsWith("https://gh-proxy.com/")) {
              $platform.Value.url = "https://gh-proxy.com/$url"
            }
          }
          $target = Join-Path $releaseDir "latest-mirror.json"
          $mirror | ConvertTo-Json -Depth 10 | Set-Content -NoNewline -Path $target
          gh release upload "${{ github.ref_name }}" $target --repo "$env:GITHUB_REPOSITORY" --clobber
