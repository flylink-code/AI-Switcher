name: Release Windows application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows installers
    runs-on: windows-latest
    env:
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: v__VERSION__
          releaseName: AI-Switcher v__VERSION__
          releaseBody: |-
            ## AI-Switcher v__VERSION__

            ## What's new

            - Added a unified localization page for Claude Code, the Claude Code extension in VS Code/Cursor, and Claude Desktop
            - Added safe installation of the Claude Code Simplified Chinese plugin, including a settings backup and Chinese defaults
            - Added detection of the official VS Code/Cursor extension and installation of its patch helper; applying a patch still requires confirmation in the editor
            - Kept Claude Desktop localization in safe resource mode without modifying app.asar or executable files

            ## 更新内容

            - 新增统一中文化配置页面，可管理 Claude Code、VS Code/Cursor 中的 Claude Code 扩展与 Claude Desktop
            - 支持安全安装 Claude Code 简体中文插件，自动备份设置并写入基础中文选项
            - 可检测 VS Code/Cursor 官方扩展并安装中文补丁助手；实际应用补丁仍需在编辑器中确认
            - Claude Desktop 继续采用安全资源模式，不修改 app.asar 或可执行文件

            Download the NSIS installer for new installations. In-app updates are signed and delivered from this release.
            新安装请下载 NSIS 安装包；应用内更新会从本 Release 获取已签名更新。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
          updaterJsonKeepUniversal: true
