name: Release application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis,msi
          # Ubuntu 22.04 matches WebKitGTK 4.1 + broader glibc compatibility for AppImage.
          - platform: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    env:
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libgtk-3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: v__VERSION__
          releaseName: AI-Switcher v__VERSION__
          releaseBody: |-
            ## AI-Switcher v__VERSION__

            ## What's new

            - Added Codex as a first-class target: providers, MCP, sessions, and local-proxy HTTP logging
            - Synced Codex session JSONL token usage into the usage dashboard with background incremental sync
            - Added usage-source filters (All / Claude Code / Claude Desktop / Codex) on Usage and Providers heatmap
            - Used Claude / Anthropic / OpenAI brand marks for source filter icons
            - Reduced startup and usage-page lag by keeping dashboard reads off the sync hot path
            - Added Ubuntu/Linux AppImage + .deb build artifacts (preview; verify on your own machine)

            ## 更新内容

            - Codex 成为一等目标：供应商、MCP、会话与本地代理 HTTP 日志
            - 将 Codex 会话 JSONL Token 用量同步到用量看板，并支持后台增量同步
            - 用量页与供应商热力图支持统计来源筛选（全部 / Claude Code / Claude Desktop / Codex）
            - 统计来源使用 Claude / Anthropic / OpenAI 品牌图标
            - 用量看板与同步解耦，减轻启动与用量页卡顿
            - 新增 Ubuntu/Linux AppImage 与 .deb 构建产物（预览版，请在本机虚拟机自行验证）

            ### Windows
            Download the NSIS installer for new installations. In-app updates are signed and delivered from this release.
            新安装请下载 NSIS 安装包；应用内更新会从本 Release 获取已签名更新。

            ### Linux (preview)
            Prefer the `.AppImage` for a portable run (`chmod +x` then execute), or install the `.deb` on Debian/Ubuntu.
            Linux builds are best-effort: Claude Desktop localization / some Windows-only tools are unavailable.
            建议优先使用 `.AppImage`（先 `chmod +x`）；Debian/Ubuntu 也可安装 `.deb`。
            Linux 为尽力支持：Claude Desktop 中文化等 Windows 专用能力不可用。
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
          updaterJsonKeepUniversal: true

  # Run after both platform builds so latest.json includes every uploaded platform.
  mirror-updater:
    name: Publish mirrored updater manifest
    needs: release
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mirror latest.json through gh-proxy
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p /tmp/ai-switcher-release
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir /tmp/ai-switcher-release; then
            echo "latest.json not found on release $tag; skip mirror"
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("/tmp/ai-switcher-release/latest.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          platforms = data.get("platforms") or {}
          for meta in platforms.values():
              url = meta.get("url")
              if isinstance(url, str) and url and not url.startswith("https://gh-proxy.com/"):
                  meta["url"] = f"https://gh-proxy.com/{url}"
          target = Path("/tmp/ai-switcher-release/latest-mirror.json")
          target.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print(f"mirrored platforms: {list(platforms)}")
          PY
          gh release upload "$tag" /tmp/ai-switcher-release/latest-mirror.json --repo "$GITHUB_REPOSITORY" --clobber
