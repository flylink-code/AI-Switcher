name: Release Windows application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows installers
    runs-on: windows-latest
    env:
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: v__VERSION__
          releaseName: AI-Switcher v__VERSION__
          releaseBody: |-
            ## AI-Switcher v__VERSION__

            ## What's new

            - Refined usage curves and added a GitHub-style daily token activity calendar
            - Added native archive-file and export-folder pickers for Claude Code sessions
            - Reduced provider-switch work on the UI path and skipped duplicate switches

            ## 更新内容

            - 优化 Token、请求数与预估成本曲线，并新增 GitHub 提交日期表风格的每日 Token 活跃度日历
            - Claude Code 会话导入支持原生文件选择，导出支持原生目录选择
            - 降低供应商切换前台阻塞，并跳过重复切换

            Download the NSIS installer for new installations. In-app updates are signed and delivered from this release.
            新安装请下载 NSIS 安装包；应用内更新会从本 Release 获取已签名更新。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
          updaterJsonKeepUniversal: true
