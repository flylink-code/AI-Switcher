name: Release Windows application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows installers
    runs-on: windows-latest
    env:
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: v__VERSION__
          releaseName: AI-Switcher v__VERSION__
          releaseBody: |-
            ## AI-Switcher v__VERSION__

            ## What's new

            - Made application update checks more resilient with a 60-second timeout and one automatic retry
            - Enhanced usage curves with input, output, cache-read, cache-write, and estimated-cost series on dual axes
            - Kept daily token activity statistics before provider and model breakdowns for a clearer reading order

            ## 更新内容

            - 应用更新检查延长至 60 秒，并在首次失败后自动重试一次
            - 用量曲线升级为输入、输出、缓存读取、缓存写入及预估成本的双轴多曲线展示
            - 按日期 Token 活跃度统计保持在供应商和模型汇总之前，便于优先查看时间分布

            Download the NSIS installer for new installations. In-app updates are signed and delivered from this release.
            新安装请下载 NSIS 安装包；应用内更新会从本 Release 获取已签名更新。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
          updaterJsonKeepUniversal: true
