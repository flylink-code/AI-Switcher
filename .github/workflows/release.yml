name: Release Windows application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows installers
    runs-on: windows-latest
    env:
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: v__VERSION__
          releaseName: AI-Switcher v__VERSION__
          releaseBody: |-
            ## AI-Switcher v__VERSION__

            ## What's new

            - Added Codex as a first-class target: providers, MCP, sessions, and local-proxy HTTP logging
            - Synced Codex session JSONL token usage into the usage dashboard with background incremental sync
            - Added usage-source filters (All / Claude Code / Claude Desktop / Codex) on Usage and Providers heatmap
            - Used Claude / Anthropic / OpenAI brand marks for source filter icons
            - Reduced startup and usage-page lag by keeping dashboard reads off the sync hot path

            ## 更新内容

            - Codex 成为一等目标：供应商、MCP、会话与本地代理 HTTP 日志
            - 将 Codex 会话 JSONL Token 用量同步到用量看板，并支持后台增量同步
            - 用量页与供应商热力图支持统计来源筛选（全部 / Claude Code / Claude Desktop / Codex）
            - 统计来源使用 Claude / Anthropic / OpenAI 品牌图标
            - 用量看板与同步解耦，减轻启动与用量页卡顿

            Download the NSIS installer for new installations. In-app updates are signed and delivered from this release.
            新安装请下载 NSIS 安装包；应用内更新会从本 Release 获取已签名更新。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
          updaterJsonKeepUniversal: true

      - name: Publish mirrored updater manifest
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "ai-switcher-release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          gh release download "${{ github.ref_name }}" --repo "$env:GITHUB_REPOSITORY" --pattern latest.json --dir $releaseDir
          $source = Join-Path $releaseDir "latest.json"
          $mirror = Get-Content -Raw -Path $source | ConvertFrom-Json
          foreach ($platform in $mirror.platforms.PSObject.Properties) {
            $url = $platform.Value.url
            if ($url -and -not $url.StartsWith("https://gh-proxy.com/")) {
              $platform.Value.url = "https://gh-proxy.com/$url"
            }
          }
          $target = Join-Path $releaseDir "latest-mirror.json"
          $mirror | ConvertTo-Json -Depth 10 | Set-Content -NoNewline -Path $target
          gh release upload "${{ github.ref_name }}" $target --repo "$env:GITHUB_REPOSITORY" --clobber
