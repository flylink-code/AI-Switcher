name: Release application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the GitHub Release once before matrix builds upload artifacts.
  # Avoids concurrent create races and "Resource not accessible" failures when
  # both Windows and Linux jobs try to create the same release.
  prepare-release:
    name: Ensure GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AI-Switcher ${tag#v}" \
            --notes "CI is uploading signed installers for ${tag}." \
            --verify-tag

  release:
    name: Build (${{ matrix.platform }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis,msi
          # Ubuntu 22.04 matches WebKitGTK 4.1 + broader glibc compatibility for AppImage.
          - platform: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Antigravity OAuth 客户端凭据（编译期注入，见 src-tauri/build.rs 与 .env.example）
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libgtk-3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: v__VERSION__
          releaseName: AI-Switcher v__VERSION__
          releaseBody: |-
            ## AI-Switcher v__VERSION__

            ## What's new

            - Usage period selector moved to the right of the toolbar
            - About **Check for updates** uses the same dialog as the title bar (fixes stacked/unstyled confirm in 1.3.8)
            - Linux preview requires Ubuntu 22.04 / Debian 12+ (WebKitGTK 4.1); Ubuntu 18.04 / 20.04 are not supported

            ## 更新内容

            - 用量页时间范围选择移到工具栏右侧
            - 关于页「检查更新」与标题栏共用同一弹窗（修复 1.3.8 标题重复、与版本信息重叠）
            - Linux 预览包需 Ubuntu 22.04 / Debian 12+（WebKitGTK 4.1）；不支持 18.04 / 20.04

            ### Windows
            Prefer the NSIS `.exe` for per-user installs without admin. MSI still requires elevation.
            In-app updates are signed and delivered from this release.
            建议使用 NSIS `.exe`（当前用户安装，通常无需管理员）；MSI 仍会请求提升权限。
            应用内更新会从本 Release 获取已签名更新。

            ### Linux (preview)
            Prefer the `.AppImage` (`chmod +x`, no sudo). `.deb` installs/updates need administrator privileges.
            Requires Ubuntu 22.04 / Debian 12 or newer (`libwebkit2gtk-4.1`). Ubuntu 18.04 / 20.04 cannot run Tauri 2.
            Linux builds are best-effort: Claude Desktop localization / some Windows-only tools are unavailable.
            建议优先使用 `.AppImage`（先 `chmod +x`，无需 sudo）；`.deb` 需要管理员权限。
            需要 Ubuntu 22.04 / Debian 12 或更新（`libwebkit2gtk-4.1`）。18.04 / 20.04 无法运行 Tauri 2。
            Linux 为尽力支持：Claude Desktop 中文化等 Windows 专用能力不可用。
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
          updaterJsonKeepUniversal: true

  # Run after both platform builds so latest.json includes every uploaded platform.
  mirror-updater:
    name: Publish mirrored updater manifest
    needs: release
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mirror latest.json through gh-proxy
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p /tmp/ai-switcher-release
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir /tmp/ai-switcher-release; then
            echo "latest.json not found on release $tag; skip mirror"
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("/tmp/ai-switcher-release/latest.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          platforms = data.get("platforms") or {}
          for meta in platforms.values():
              url = meta.get("url")
              if isinstance(url, str) and url and not url.startswith("https://gh-proxy.com/"):
                  meta["url"] = f"https://gh-proxy.com/{url}"
          target = Path("/tmp/ai-switcher-release/latest-mirror.json")
          target.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print(f"mirrored platforms: {list(platforms)}")
          PY
          gh release upload "$tag" /tmp/ai-switcher-release/latest-mirror.json --repo "$GITHUB_REPOSITORY" --clobber

  # After a successful publish, drop formal releases beyond the retention window.
  # GitHub has no built-in "keep N releases" setting; this job enforces it on every tag push.
  prune-old-releases:
    name: Prune old releases
    needs: mirror-updater
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      KEEP_COUNT: "18"
    steps:
      - name: Delete releases beyond retention limit
        shell: bash
        run: |
          set -euo pipefail

          echo "Repo: $REPO"
          echo "Keep latest formal releases: $KEEP_COUNT"

          releases_json="$(gh api --paginate "repos/$REPO/releases")"

          mapfile -t delete_rows < <(
            echo "$releases_json" | jq -r -s '
              add
              | map(select(.prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))))
              | sort_by(.created_at)
              | reverse
              | .['"$KEEP_COUNT"':]
              | .[]
              | [.id, .tag_name, .name]
              | @tsv
            '
          )

          if ((${#delete_rows[@]} == 0)); then
            echo "Nothing to prune."
            exit 0
          fi

          for row in "${delete_rows[@]}"; do
            IFS=$'\t' read -r release_id tag_name release_name <<< "$row"
            echo "Deleting release $release_name (tag=$tag_name, id=$release_id)"
            gh api --method DELETE "repos/$REPO/releases/$release_id"
            if [[ -n "$tag_name" ]]; then
              echo "Deleting tag ref: refs/tags/$tag_name"
              gh api --method DELETE "repos/$REPO/git/refs/tags/$tag_name" || echo "Tag $tag_name already absent; skip"
            fi
          done

          echo "Pruned ${#delete_rows[@]} release(s)."
