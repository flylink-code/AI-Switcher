name: Release application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the GitHub Release once before matrix builds upload artifacts.
  # Avoids concurrent create races and "Resource not accessible" failures when
  # both Windows and Linux jobs try to create the same release.
  prepare-release:
    name: Ensure GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render bilingual release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/render-release-notes.mjs /tmp/ai-switcher-release-notes.md

      - name: Create or update GitHub Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="AI-Switcher ${tag#v}"
          notes="/tmp/ai-switcher-release-notes.md"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$notes"
            echo "Updated release notes for $tag"
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file "$notes" \
            --verify-tag

  release:
    name: Build (${{ matrix.platform }})
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis,msi
          # Ubuntu 22.04 matches WebKitGTK 4.1 + broader glibc compatibility for AppImage.
          - platform: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      CI: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Antigravity OAuth 客户端凭据（编译期注入，见 src-tauri/build.rs 与 .env.example）
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libgtk-3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: v__VERSION__
          releaseName: AI-Switcher v__VERSION__
          # Notes come from i18n about.changelog via scripts/render-release-notes.mjs.
          # Do not hardcode a stale releaseBody here — tauri-action would overwrite it.
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
          updaterJsonKeepUniversal: true

  # Re-apply bilingual notes after installer upload (tauri-action may rewrite the body).
  publish-release-notes:
    name: Publish bilingual release notes
    needs: release
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Render and upload release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          node scripts/render-release-notes.mjs /tmp/ai-switcher-release-notes.md
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag is missing; skip notes"
            exit 0
          fi
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AI-Switcher ${tag#v}" \
            --notes-file /tmp/ai-switcher-release-notes.md

  # Run after both platform builds so latest.json includes every uploaded platform.
  mirror-updater:
    name: Publish mirrored updater manifest
    needs: publish-release-notes
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Mirror latest.json through gh-proxy
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p /tmp/ai-switcher-release
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir /tmp/ai-switcher-release; then
            echo "latest.json not found on release $tag; skip mirror"
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path("/tmp/ai-switcher-release/latest.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          platforms = data.get("platforms") or {}
          for meta in platforms.values():
              url = meta.get("url")
              if isinstance(url, str) and url and not url.startswith("https://gh-proxy.com/"):
                  meta["url"] = f"https://gh-proxy.com/{url}"
          target = Path("/tmp/ai-switcher-release/latest-mirror.json")
          target.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print(f"mirrored platforms: {list(platforms)}")
          PY
          gh release upload "$tag" /tmp/ai-switcher-release/latest-mirror.json --repo "$GITHUB_REPOSITORY" --clobber

  # After a successful publish, drop formal releases beyond the retention window.
  # GitHub has no built-in "keep N releases" setting; this job enforces it on every tag push.
  prune-old-releases:
    name: Prune old releases
    needs: mirror-updater
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      KEEP_COUNT: "18"
    steps:
      - name: Delete releases beyond retention limit
        shell: bash
        run: |
          set -euo pipefail

          echo "Repo: $REPO"
          echo "Keep latest formal releases: $KEEP_COUNT"

          releases_json="$(gh api --paginate "repos/$REPO/releases")"

          mapfile -t delete_rows < <(
            echo "$releases_json" | jq -r -s '
              add
              | map(select(.prerelease == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))))
              | sort_by(.created_at)
              | reverse
              | .['"$KEEP_COUNT"':]
              | .[]
              | [.id, .tag_name, .name]
              | @tsv
            '
          )

          if ((${#delete_rows[@]} == 0)); then
            echo "Nothing to prune."
            exit 0
          fi

          for row in "${delete_rows[@]}"; do
            IFS=$'\t' read -r release_id tag_name release_name <<< "$row"
            echo "Deleting release $release_name (tag=$tag_name, id=$release_id)"
            gh api --method DELETE "repos/$REPO/releases/$release_id"
            if [[ -n "$tag_name" ]]; then
              echo "Deleting tag ref: refs/tags/$tag_name"
              gh api --method DELETE "repos/$REPO/git/refs/tags/$tag_name" || echo "Tag $tag_name already absent; skip"
            fi
          done

          echo "Pruned ${#delete_rows[@]} release(s)."
